name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install terminal multiplexers
        run: brew install rmux tmux

      - name: Smoke checks
        run: bash scripts/check.sh smoke

      - name: RMUX checks through a symlink with pane variables set
        run: |
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dot-configs-link"
          TMUX="$RUNNER_TEMP/caller-tmux,1,0" TMUX_PANE=%0 RMUX="$RUNNER_TEMP/caller-rmux,1,0" RMUX_PANE=%0 \
            bash "$RUNNER_TEMP/dot-configs-link/scripts/check.sh" rmux

  shell:
    name: Shell helpers (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon keeps Homebrew in /opt/homebrew; Intel keeps it in /usr/local.
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew shell add-ons
        run: brew install autojump zsh-fast-syntax-highlighting

      - name: Shell update checks
        run: bash scripts/check.sh shell

      - name: Load add-ons from this Mac's Homebrew prefix
        run: |
          echo "arch=$(uname -m) prefix=$(brew --prefix)"
          env -u HOMEBREW_PREFIX HOME="$RUNNER_TEMP/home" zsh -f -c '
            source config/zsh/custom.zsh >/dev/null
            [[ "$(whence -w j)" = "j: function" ]]
            [[ "$(whence -w fast-theme)" = "fast-theme: function" ]]
          '

  shellcheck:
    name: ShellCheck (errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: bash scripts/check.sh shellcheck

      # local/ belongs to forks and private overlays. Upstream never tracks it,
      # so a fork's local/ never conflicts with an upstream merge.
      - name: Upstream keeps local/ untracked
        if: github.repository == 'D0n9X1n/dot-config'
        run: test -z "$(git ls-files local)"
