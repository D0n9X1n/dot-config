# Native tmux 3.7c. Prefix: C-q. Theme: Apollo.

unbind C-b
set -g prefix C-q
bind C-q send-prefix
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

set -g default-terminal "tmux-256color"
set -s extended-keys on
set -s extended-keys-format csi-u
set -ag terminal-overrides ",wezterm:RGB,xterm-256color:RGB,*-direct:RGB"
set -as terminal-features ",wezterm*:RGB"
set -as terminal-features ",xterm-256color:extkeys:RGB:osc7"
set -as terminal-features ",tmux-256color:RGB"
set -ag terminal-overrides ",*:Smulx=\\E[4::%p1%dm,*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
# Native tmux otherwise drops Shift on Enter in nonrequesting applications.
bind -n S-Enter if -F '#{==:#{pane_key_mode},VT10x}' { send-keys C-j } { send-keys S-Enter }

set-environment -gu TERMINFO
set-environment -gu TERMINFO_DIRS
set-environment -gu TERMCAP
set-environment -g COLORTERM truecolor
set-environment -g FORCE_COLOR 3

set -g mouse on
bind -n MouseDown1Status select-window -t =
bind -n MouseDown1Pane { select-pane -t=; send -M }
bind -n MouseDrag1Pane { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -M } }
bind T if-shell -F '#{mouse}' 'set -g mouse off ; display-message "mouse OFF: native terminal selection enabled"' 'set -g mouse on ; display-message "mouse ON: pane mouse mode enabled"'
set -sg escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
set -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g allow-rename off
setw -g automatic-rename off
setw -g automatic-rename-format '#{pane_current_command}'
# After-command hooks inherit the renamed window, including noncurrent targets.
set-hook -g after-rename-window { if -F '#{==:#{window_name},}' { set-window-option automatic-rename on } }

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Parsed arguments keep quotes literal; one option lookup avoids expanding title formats.
bind n command-prompt -l -I '#{E:@tab-name}' -p '(rename-window)' { set -w @rename-input '%%'; rename-window '#{@rename-input}'; set -uw @rename-input }
bind , command-prompt -l -I '#{E:@tab-name}' -p '(rename-window)' { set -w @rename-input '%%'; rename-window '#{@rename-input}'; set -uw @rename-input }

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window
bind -r Left previous-window
bind -r Right next-window
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

setw -g mode-keys vi
set -g status-keys vi
set -s copy-command 'pbcopy'
set -s set-clipboard on
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

source-file -q ~/.config/tmux-apollo-theme/apollo.tmux
# tmux 3.7 overlays prompts on the status grid unless their style includes fill.
set -gF message-style '#{message-style},fill=#{s/.*bg=([^,]+).*/\1/:message-style}'
set -gF message-command-style '#{message-command-style},fill=#{s/.*bg=([^,]+).*/\1/:message-command-style}'

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 24
set -g status-left '#{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-bell-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]#{l:#[}#{window-status-bell-style}] #{=19:session_name} #{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-bell-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold] '
set -g status-right-length 24
set -g status-right " #{?client_prefix,PREFIX  ,}%H:%M "
set -g @tab-icon '#{?#{==:#{pane_current_command},claude},,#{?#{==:#{pane_current_command},copilot},,#{?#{m/r:^(nvim|vim)$,#{pane_current_command}},,}}}'
# Native names store doubled backslashes; edit and display one literal copy.
set -g @tab-name '#{s/^[] //;s/\\\\/\\/:window_name}'
set -g @tab-title '#{qh;s/^[] //;s/\\\\/\\/:window_name}'
set -g @tab-inactive-style '#{?window_bell_flag,#{window-status-bell-style},#{?window_activity_flag,#{window-status-activity-style},#{window-status-style}}}'
set -g window-status-current-style 'bg=#365b80,fg=#ffffff,bold'
set -gF window-status-style '#{s/bg=[^,]+/bg=#{s/.*bg=([^,]+).*/\1/:status-style}/:window-status-style}'
set -gF window-status-activity-style '#{s/bg=[^,]+/bg=#{s/.*bg=([^,]+).*/\1/:status-style}/:window-status-activity-style}'
set -g window-status-format '#{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:#{E:@tab-inactive-style}},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]#{l:#[}#{E:@tab-inactive-style}] #I:#{E:@tab-icon} #{E:@tab-title} #{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:#{E:@tab-inactive-style}},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]'
set -g window-status-current-format '#{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-current-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]#{l:#[}#{window-status-current-style}] #I:#{E:@tab-icon} #{E:@tab-title}#{?window_zoomed_flag, ZOOM,} #{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-current-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]'
set -g window-status-separator " "
set -g pane-border-status off
