# ~/.rmux.conf
# RMUX 0.10.x profile adapted from the upstream human-friendly example.
# Prefix: C-q. Theme: Apollo.

unbind C-b
set -g prefix C-q
bind C-q send-prefix

bind r source-file ~/.rmux.conf \; display-message "RMUX reloaded"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",wezterm:RGB,xterm-256color:RGB,*-direct:RGB"
set -as terminal-features ",wezterm*:RGB"
set -as terminal-features ",xterm-256color:RGB:osc7"
set -as terminal-features ",tmux-256color:RGB"
set -ag terminal-overrides ",*:Smulx=\\E[4::%p1%dm,*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

set-environment -gu TERMINFO
set-environment -gu TERMINFO_DIRS
set-environment -gu TERMCAP
set-environment -g COLORTERM truecolor
set-environment -g FORCE_COLOR 3

set -g mouse on
bind -n MouseDown1Pane { select-pane -t=; send -M }
bind -n MouseDrag1Pane { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -M } }
bind T if-shell -F '#{mouse}' 'set -g mouse off ; display-message "mouse OFF: native terminal selection enabled"' 'set -g mouse on ; display-message "mouse ON: pane mouse mode enabled"'
set -sg escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
set -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g allow-rename off
setw -g automatic-rename off

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

setw -g mode-keys vi
set -g status-keys vi
set -s copy-command 'pbcopy'
set -s set-clipboard on
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

source-file -q ~/.config/rmux-apollo-theme/apollo-rmux.conf

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-left "  #S   "
set -g status-right-length 70
set -g status-right "#{?client_prefix,󰌌 PREFIX  ,}󰥔 %H:%M │ %Y-%m-%d "
set -g window-status-format "  #I·#W  "
set -g window-status-current-format "  #I·#W#{?window_zoomed_flag, ,}  "
set -g window-status-separator " "
set -g pane-border-status off
