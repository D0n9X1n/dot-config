# ~/.rmux.conf
# RMUX 0.10.x profile adapted from the upstream human-friendly example.
# Prefix: C-q. Theme: Apollo.

unbind C-b
set -g prefix C-q
bind C-q send-prefix

bind r source-file ~/.rmux.conf \; display-message "RMUX reloaded"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",wezterm:RGB,xterm-256color:RGB,*-direct:RGB"
set -as terminal-features ",wezterm*:RGB"
set -as terminal-features ",xterm-256color:RGB:osc7"
set -as terminal-features ",tmux-256color:RGB"
set -ag terminal-overrides ",*:Smulx=\\E[4::%p1%dm,*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

set-environment -gu TERMINFO
set-environment -gu TERMINFO_DIRS
set-environment -gu TERMCAP
set-environment -g COLORTERM truecolor
set-environment -g FORCE_COLOR 3

set -g mouse on
# RMUX 0.10 switch-client mouse targets misread internal pane 0 with pane-base-index 1.
bind -n MouseDown1Status select-window -t =
bind -n MouseDown1Pane { select-pane -t=; send -M }
bind -n MouseDrag1Pane { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -M } }
bind T if-shell -F '#{mouse}' 'set -g mouse off ; display-message "mouse OFF: native terminal selection enabled"' 'set -g mouse on ; display-message "mouse ON: pane mouse mode enabled"'
set -sg escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
set -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g allow-rename off
setw -g automatic-rename off

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind n command-prompt -I "#W" { rename-window "%%" }

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window
bind -r Left previous-window
bind -r Right next-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

setw -g mode-keys vi
set -g status-keys vi
set -s copy-command 'pbcopy'
set -s set-clipboard on
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

source-file -q ~/.config/rmux-apollo-theme/apollo-rmux.conf

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 24
# Emit style delimiters after format expansion so theme colors resolve first.
set -g status-left '#{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-bell-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]#{l:#[}#{window-status-bell-style}] #{=19:session_name} #{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-bell-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold] '
set -g status-right-length 24
set -g status-right " #{?client_prefix,PREFIX  ,}%H:%M "
set -g @tab-inactive-style '#{?window_bell_flag,#{window-status-bell-style},#{?window_activity_flag,#{window-status-activity-style},#{window-status-style}}}'
set -g window-status-current-style 'bg=#365b80,fg=#ffffff,bold'
set -gF window-status-style '#{s/bg=[^,]+/bg=#{s/.*bg=([^,]+).*/\1/:status-style}/:window-status-style}'
set -gF window-status-activity-style '#{s/bg=[^,]+/bg=#{s/.*bg=([^,]+).*/\1/:status-style}/:window-status-activity-style}'
set -g window-status-format '#{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:#{E:@tab-inactive-style}},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]#{l:#[}#{E:@tab-inactive-style}] #I:#W #{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:#{E:@tab-inactive-style}},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]'
set -g window-status-current-format '#{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-current-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]#{l:#[}#{window-status-current-style}] #I:#W#{?window_zoomed_flag, ZOOM,} #{l:#[}fg=#{s/.*bg=([^,]+).*/\1/:window-status-current-style},bg=#{s/.*bg=([^,]+).*/\1/:status-style},nobold]'
set -g window-status-separator " "
set -g pane-border-status off
